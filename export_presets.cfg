[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="*/tools/*, */docs/*, */.worktrees/*, */__pycache__/*, *.md, *.py, *.blend, *.blend1, *.xcf"
export_path="build/TumbangPreso.exe"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/embed_pck=false
texture_format/bptc=true
texture_format/s3tc=true
texture_format/etc=false
texture_format/etc2=false
binary_format/architecture="x86_64"
codesign/enable=false
codesign/timestamp=true
codesign/timestamp_server_url=""
codesign/digest_algorithm=1
codesign/description=""
codesign/custom_options=PackedStringArray()
application/modify_resources=true
application/icon="res://icon.ico"
application/manifest_file=""
application/console_wrapper_icon="res://icon.ico"
application/icon_interpolation=4
application/file_version=""
application/product_version=""
application/company_name=""
application/product_name="Tumbang Preso"
application/file_description=""
application/copyright=""
application/trademarks=""
application/export_angle=0
application/export_d3d12=false
application/d3d12_agility_sdk_multiarch=true
ssh_remote_deploy/enabled=false
ssh_remote_deploy/host="user@host"
ssh_remote_deploy/port="22"
ssh_remote_deploy/extra_args_ssh=""
ssh_remote_deploy/extra_args_scp=""
ssh_remote_deploy/run_script="#!/usr/bin/env bash\nexport DISPLAY=:0\nexec \"{temp_dir}/{exe_name}\" {godot_args}"
ssh_remote_deploy/cleanup_script="#!/usr/bin/env bash\nkill $(pgrep -x -f \"{temp_dir}/{exe_name}\")\nrm -rf \"{temp_dir}\""

; ---------------------------------------------------------------------------
; preset.2 "Linux Server" is the dedicated-server build. It is deliberately
; the LAST preset in this file even though its number is 2, so that the two
; player-facing presets above stay adjacent. See tools/export.md and §7b of
; docs/Dedicated_Server_Deployment.md for the why and the numbers.
;
; ⚠️ ConfigFile does not preserve comments. The Godot editor rewrites this
; whole file whenever anyone opens Project > Export and changes anything, and
; every comment in it disappears at that moment. Do not put load-bearing
; explanation here — it lives in tools/export.md, which git keeps.
; ---------------------------------------------------------------------------

